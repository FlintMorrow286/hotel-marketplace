x-backend-environment: &backend-environment
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_BASE_URL: "${APP_BASE_URL:?Set APP_BASE_URL (the public https address) in .env}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-hotel_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hotel_mp}"
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
  WEBHOOK_SEAL_KEY: "${WEBHOOK_SEAL_KEY:?Set WEBHOOK_SEAL_KEY in .env}"
  WEBHOOK_SEAL_KEY_PREVIOUS: "${WEBHOOK_SEAL_KEY_PREVIOUS:-}"
  MEDIA_DIR: /app/media
  API_DOCS: "${API_DOCS:-}"
  FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
  # The rest of .env.example. A key without a value takes what the shell or .env gives it and,
  # when neither does, stays unset, so the application's own default applies. A key that is not
  # named here never reaches the containers (tests/test_compose_env.py keeps the two in step).
  ALLOW_PRIVATE_TARGETS:
  PAYMENT_MODE:
  JWT_ALGORITHM:
  ACCESS_TOKEN_TTL_MIN:
  HOLD_TTL_MIN:
  LOGIN_LIMIT_PER_MIN:
  REGISTER_LIMIT_PER_MIN:
  LOOKUP_LIMIT_PER_MIN:
  HOLD_LIMIT_PER_MIN:
  AVAILABILITY_LIMIT_PER_MIN:
  SEARCH_LIMIT_PER_MIN:
  PHOTO_UPLOAD_LIMIT_PER_MIN:
  ICAL_SYNC_LIMIT_PER_MIN:
  MAIL_BACKEND:
  MAIL_FROM:
  MAIL_REPLY_TO:
  SMTP_HOST:
  SMTP_PORT:
  SMTP_USER:
  SMTP_PASSWORD:
  SMTP_STARTTLS:
  SMTP_SSL:
  TELEGRAM_BOT_TOKEN:
  SENTRY_DSN:

# `app` builds the image; `jobs` runs the same one. Two services that both build under one tag
# make `docker compose build` fail ("image ... already exists").
# Docker's default json-file driver keeps every line until the container is removed: 75 bytes per request
# were measured, which is 124 MiB a day at 20 requests/s. Five files of 20 MB per service instead.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  image: hotel-marketplace:local
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import os, urllib.request; urllib.request.urlopen(
        'http://127.0.0.1:' + os.getenv('APP_PORT', '8000') + '/readyz',
        timeout=3).read()
    interval: 30s
    timeout: 5s
    start_period: 60s
    retries: 3

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hotel_user}"
      POSTGRES_DB: "${POSTGRES_DB:-hotel_mp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    <<: *backend
    build:
      context: .
    environment:
      <<: *backend-environment
      RUN_BACKGROUND_JOBS: "false"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media

  jobs:
    <<: *backend
    pull_policy: never  # the image comes from the `app` build above, never from a registry
    environment:
      <<: *backend-environment
      RUN_BACKGROUND_JOBS: "true"
      WEB_CONCURRENCY: "1"

volumes:
  postgres_data:
  media_data:
